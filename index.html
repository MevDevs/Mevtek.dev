<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mevtek</title>
<meta name="description" content="Mevtek — próximamente.">
<meta name="theme-color" content="#00265F">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<style>
:root{
  color-scheme:dark;
  --cover:#00265F;
  --cover-lift:#0B3A7F;
  --cover-deep:#001A42;
  --muted:#A8BEE6;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100svh;
  display:grid;
  place-content:center;
  gap:.9rem;
  padding:2rem;
  text-align:center;
  color:#fff;
  background:linear-gradient(179deg,
    var(--cover-lift) 0%, var(--cover) 34%, var(--cover) 58%, var(--cover-deep) 100%);
  font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
/* Same engraved hairline stock as the rest of the domain. */
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;
  background:repeating-linear-gradient(58deg, rgba(255,255,255,.032) 0 1px, transparent 1px 7px);
  mask-image:radial-gradient(120% 78% at 50% 12%, #000 0%, transparent 100%);
}
h1{
  margin:0;
  font-size:clamp(2.25rem,11vw,3.5rem);
  font-weight:800;
  letter-spacing:-.03em;
  line-height:1;
}
p{
  margin:0;
  font-size:.75rem;
  font-weight:600;
  letter-spacing:.24em;
  text-transform:uppercase;
  color:var(--muted);
}
</style>
</head>
<body>
  <h1>Mevtek</h1>
  <p>Próximamente</p>
</body>
</html>
